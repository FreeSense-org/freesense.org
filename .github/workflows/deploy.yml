name: Deploy to Cloudflare Pages

# Pushes and manual runs deploy the Astro site and its live release-feed Function.
# The hourly schedule only verifies that the canonical and website feeds agree.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm test && npm run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy dist --project-name=freesense --branch=main --commit-dirty=true

      - name: Verify the exact Pages deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${DEPLOYMENT_URL}" =~ ^https://[a-z0-9-]+\.freesense\.pages\.dev/?$ ]]
          css_path="$(grep -oE 'href="/_astro/[^"]+\.css"' dist/download/index.html \
            | cut -d'"' -f2 \
            | tail -n1)"
          test -n "$css_path"
          verified=false
          for attempt in {1..36}; do
            content_type="$(curl --fail --silent --show-error --max-time 30 \
              --output /dev/null --write-out '%{content_type}' \
              "${DEPLOYMENT_URL%/}${css_path}" 2>/dev/null || true)"
            if [[ "$content_type" == text/css* ]] && \
                bash scripts/verify-release-feeds.sh "${DEPLOYMENT_URL}"; then
              verified=true
              break
            fi
            echo "Attempt ${attempt}: exact deployment has not converged (CSS type: ${content_type:-none})."
            [[ "$attempt" == 36 ]] || sleep 5
          done
          [[ "$verified" == true ]]

  reconcile:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the production website mirrors the canonical release feed
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..6}; do
            if bash scripts/verify-release-feeds.sh https://freesense.org; then
              echo "The production website serves the canonical release feed."
              exit 0
            fi
            echo "Attempt ${attempt}: production release feed has not converged."
            if [[ "$attempt" -lt 6 ]]; then sleep 10; fi
          done
          echo "The production website release feed differs from the canonical feed." >&2
          exit 1
