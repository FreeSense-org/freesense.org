name: Deploy to Cloudflare Pages

# Builds the Astro site and deploys it to the Cloudflare Pages project "freesense"
# (freesense.org / www.freesense.org) on every push to main. Manual runs allowed too.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Import the canonical release feed
        shell: bash
        run: |
          set -euo pipefail
          candidate=$(mktemp)
          trap 'rm -f "$candidate"' EXIT
          if curl --fail --silent --show-error --location --max-time 30 \
            https://pkg.freesense.org/v1/releases.json --output "$candidate"; then
            jq -e '.schema_version == "freesense.downloads/v1" and
              (.channels | type == "object") and
              (has("generated"))' "$candidate" >/dev/null
            mv "$candidate" public/releases.json
          else
            echo "Canonical feed is not published yet; retaining the checked bootstrap feed."
          fi

      - name: Build site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=freesense --branch=main

      - name: Verify deployed download assets
        shell: bash
        run: |
          set -euo pipefail

          css_path="$(grep -oE 'href="/_astro/[^"]+\.css"' dist/download/index.html \
            | cut -d'"' -f2 \
            | tail -n1)"
          test -n "$css_path"

          for attempt in {1..12}; do
            content_type="$(curl --silent --show-error --output /dev/null \
              --write-out '%{content_type}' "https://freesense.org${css_path}")"
            if [[ "$content_type" == text/css* ]]; then
              echo "Verified ${css_path} (${content_type})"
              exit 0
            fi
            echo "Attempt ${attempt}: ${css_path} returned ${content_type:-no content type}"
            if [[ "$attempt" -lt 12 ]]; then
              sleep 10
            fi
          done

          echo "The deployed download stylesheet is not being served as CSS" >&2
          exit 1
